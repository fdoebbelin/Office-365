<title id="t">Wiederkehrende Termine: die Serie</title><desc id="d">Zeitstrahl von Januar bis Juni, in jedem Monat ist der erste Montag markiert: Heizungswartung monatlich am ersten Montag, 08:00 bis 09:30. Darunter die Schritte: Serie erstellen anklicken, Muster Monatlich, Am ersten Montag wählen, Ende festlegen. Hinweis: einmal anlegen, Outlook trägt jeden Monat ein; Erinnerung 1 Tag vorher.</desc>
