<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Zu einer Besprechung einladen</title><desc id="d">Sie als Organisation schicken eine Einladung zur Sicherheitsbegehung per E-Mail an Thomas Weber und Jan Müller. Die beiden antworten mit Zusagen, Mit Vorbehalt oder Ablehnen; die Besprechung steht dann in ihrem Kalender, und Sie bekommen eine Antwort. Hinweis: Die Eingeladenen sehen nur diese Besprechung, nicht Ihren übrigen Kalender.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Zu einer Besprechung einladen</text>
<circle cx="150" cy="316" r="14" fill="#1F3A5F"/><path d="M128 352 a22 22 0 0 1 44 0 z" fill="#1F3A5F"/><text x="150" y="380" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Sie (Organisation)</text><rect x="270" y="260" width="280" height="130" rx="12" fill="#E6F0FA" stroke="#0F6CBD" stroke-width="2"/><path d="M300 285 h60 v42 h-60 z M300 285 l30 22 l30 -22" fill="none" stroke="#0F6CBD" stroke-width="3"/><text x="380" y="302" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">Einladung</text><text x="380" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">per E-Mail</text><text x="290" y="370" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F6CBD" text-anchor="start">Sicherheitsbegehung</text><path d="M200 320 h60" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><path d="M560 300 L640 230" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><path d="M560 350 L640 420" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><circle cx="700" cy="206" r="14" fill="#0F6CBD"/><path d="M678 242 a22 22 0 0 1 44 0 z" fill="#0F6CBD"/><text x="700" y="270" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="middle">Thomas Weber</text><circle cx="700" cy="406" r="14" fill="#0F6CBD"/><path d="M678 442 a22 22 0 0 1 44 0 z" fill="#0F6CBD"/><text x="700" y="470" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="middle">Jan Müller</text><rect x="820" y="190" width="220" height="56" rx="8" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="930" y="226" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Zusagen</text><rect x="820" y="270" width="220" height="56" rx="8" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="930" y="306" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Mit Vorbehalt</text><rect x="820" y="350" width="220" height="56" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="2"/><text x="930" y="386" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Ablehnen</text><text x="1060" y="225" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">→ steht im</text><text x="1060" y="252" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="start">Kalender</text><text x="1060" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">→ Sie bekommen</text><text x="1060" y="412" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="start">eine Antwort</text><rect x="60" y="530" width="1160" height="95" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="640" y="570" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="middle">Die Eingeladenen sehen nur diese Besprechung –</text><text x="640" y="604" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="middle">nicht Ihren übrigen Kalender.</text>
