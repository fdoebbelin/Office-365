<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Der Kalender in Outlook</title><desc id="d">Schema des Outlook-Kalenders: In der App-Leiste links führt das Kalendersymbol zum Kalender. Oben die Schaltfläche Neues Ereignis und die Ansichten Tag, Arbeitswoche, Woche und Monat sowie Heute. Darunter eine Arbeitswoche von Montag bis Freitag mit drei Einträgen: Heizungswartung, Fluchtwege prüfen und Sicherheitsbegehung.</desc>
