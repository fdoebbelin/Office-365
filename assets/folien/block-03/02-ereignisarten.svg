<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Termin, Besprechung, ganztägig</title><desc id="d">Drei Karten: Ein Termin ist nur für Sie, niemand ist eingeladen, die Schaltfläche heißt Speichern – Beispiel Fluchtwege prüfen. Eine Besprechung ist mit anderen und geht als Einladung per E-Mail hinaus, die Schaltfläche heißt Senden – Beispiel Sicherheitsbegehung. Ein ganztägiges Ereignis hat keine Uhrzeit, Schalter Ganztägig – Beispiel Aufzug gesperrt.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Termin, Besprechung, ganztägig</text>
<text x="640" y="170" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#1E2430" text-anchor="middle">Alles beginnt mit „Neues Ereignis“ – was daraus wird, entscheiden Sie beim Ausfüllen.</text><rect x="60" y="200" width="370" height="430" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M60 214 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v62 h-370 z" fill="#107C41"/><text x="245.0" y="250" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Termin</text><text x="245.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">nur für Sie</text><text x="245.0" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5B6472" text-anchor="middle">niemand eingeladen</text><line x1="90" y1="400" x2="400" y2="400" stroke="#D5DAE1" stroke-width="2"/><text x="245.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="245.0" y="476" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#107C41" text-anchor="middle">Fluchtwege prüfen</text><rect x="171.0" y="530" width="148" height="50" rx="8" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="245.0" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Speichern</text><rect x="455" y="200" width="370" height="430" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M455 214 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v62 h-370 z" fill="#0F6CBD"/><text x="640.0" y="250" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Besprechung</text><text x="640.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">mit anderen</text><text x="640.0" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5B6472" text-anchor="middle">Einladung per E-Mail</text><line x1="485" y1="400" x2="795" y2="400" stroke="#D5DAE1" stroke-width="2"/><text x="640.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="640.0" y="476" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#0F6CBD" text-anchor="middle">Sicherheitsbegehung</text><rect x="584.0" y="530" width="112" height="50" rx="8" fill="#E6F0FA" stroke="#0F6CBD" stroke-width="2"/><text x="640.0" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Senden</text><rect x="850" y="200" width="370" height="430" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M850 214 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v62 h-370 z" fill="#E8A33D"/><text x="1035.0" y="250" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ganztägig</text><text x="1035.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">ohne Uhrzeit</text><text x="1035.0" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#5B6472" text-anchor="middle">gilt den ganzen Tag</text><line x1="880" y1="400" x2="1190" y2="400" stroke="#D5DAE1" stroke-width="2"/><text x="1035.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="1035.0" y="476" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#9A6412" text-anchor="middle">Aufzug gesperrt</text><rect x="895.0" y="530" width="280" height="50" rx="8" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="1035.0" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Schalter „Ganztägig“</text>
