<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Das Fenster „Neues Ereignis“</title><desc id="d">Schema des Ereignisfensters mit sechs nummerierten Stellen: 1 Titel, 2 Teilnehmende einladen – macht daraus eine Besprechung, 3 Datum und Uhrzeit oder der Schalter Ganztägig, 4 Serie erstellen für Wiederkehrendes, 5 Erinnerung mit der Glocke, zum Beispiel 1 Tag vorher, 6 Speichern, oder Senden, sobald jemand eingeladen ist. Beispiel: Heizungswartung, Montag 08:00 bis 09:30, Technikraum 1.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
