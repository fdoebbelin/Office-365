 fill="#1E2430" text-anchor="start">Datum und Uhrzeit</text><text x="856" y="356" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#5B6472" text-anchor="start">oder Schalter „Ganztägig“</text><circle cx="820" cy="400" r="22" fill="#0F6CBD"/><text x="820" y="408" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="856" y="402" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Serie erstellen</text><text x="856" y="432" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#5B6472" text-anchor="start">für Wiederkehrendes</text><circle cx="820" cy="476" r="22" fill="#0F6CBD"/><text x="820" y="484" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="856" y="478" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Erinnerung</text><text x="856" y="508" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#5B6472" text-anchor="start">Glocke: z. B. 1 Tag vorher</text><circle cx="820" cy="552" r="22" fill="#0F6CBD"/><text x="820" y="560" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="856" y="554" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Speichern / Senden</text><text x="856" y="584" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#5B6472" text-anchor="start">Senden, sobald jemand eingeladen ist</text><circle cx="710" cy="205" r="15" fill="#0F6CBD"/><text x="710" y="211" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="710" cy="275" r="15" fill="#0F6CBD"/><text x="710" y="281" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="710" cy="345" r="15" fill="#0F6CBD"/><text x="710" y="351" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="496" cy="484" r="15" fill="#0F6CBD"/><text x="496" y="490" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="748" cy="484" r="15" fill="#0F6CBD"/><text x="748" y="490" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><rect x="90" y="580" width="130" height="36" rx="6" fill="#0F6CBD" stroke="none" stroke-width="2"/><text x="155" y="604" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Speichern</text><circle cx="238" cy="598" r="15" fill="#0F6CBD"/><text x="238" y="604" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
