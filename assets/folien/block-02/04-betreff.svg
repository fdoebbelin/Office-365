<title id="t">Ein guter Betreff</title><desc id="d">Links schlechte Betreffzeilen: Hallo, kein Betreff, Frage, Dringend. Rechts gute: Störungsmeldung – Wasserhahn tropft, Teeküche 2. OG; Aufzugswartung – Bitte um Terminvorschlag; Reinigung Konferenzraum 3.10 – Rückfrage; Ausfall Heizung – Büro 305 bleibt kalt. Regel: Was und wo – am Betreff erkennt man, worum es geht.</desc>
