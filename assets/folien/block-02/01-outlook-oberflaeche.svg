<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Das neue Outlook auf einen Blick</title><desc id="d">Schema des neuen Outlook-Fensters: oben das Menüband mit der Schaltfläche Neue E-Mail, links die schmale App-Leiste, daneben der Ordnerbereich mit Posteingang, Entwürfe, Gesendete Elemente, Gelöschte Elemente und Archiv, in der Mitte die Nachrichtenliste, rechts der Lesebereich mit den Schaltflächen Antworten, Allen antworten und Weiterleiten.</desc>
