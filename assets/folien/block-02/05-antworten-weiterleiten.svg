E1" stroke-width="2"/><path d="M850 159 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v62 h-370 z" fill="#107C41"/><text x="1035.0" y="195" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Weiterleiten</text><circle cx="940" cy="286" r="14" fill="#5B6472"/><path d="M918 322 a22 22 0 0 1 44 0 z" fill="#5B6472"/><text x="940" y="350" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="middle">Sie</text><circle cx="1130" cy="286" r="14" fill="#107C41"/><path d="M1108 322 a22 22 0 0 1 44 0 z" fill="#107C41"/><text x="1130" y="350" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="middle">neue Person</text><path d="M980 300 h100" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><text x="1035.0" y="430" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#1E2430" text-anchor="middle">an eine neue Person –</text><text x="1035.0" y="462" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#1E2430" text-anchor="middle">Ihr Kommentar steht oben</text><line x1="880" y1="500" x2="1190" y2="500" stroke="#D5DAE1" stroke-width="2"/><text x="1035.0" y="540" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">Betreff beginnt mit</text><text x="1035.0" y="590" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#107C41" text-anchor="middle">WG:</text>
