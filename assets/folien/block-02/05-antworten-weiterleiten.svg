<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Antworten oder weiterleiten?</title><desc id="d">Drei Karten: Antworten geht nur an die Person, die geschrieben hat, der Betreff beginnt mit AW. Allen antworten geht an die Person und alle aus An und Cc, Betreff ebenfalls AW. Weiterleiten schickt die E-Mail an eine neue Person, der eigene Kommentar steht oben, der Betreff beginnt mit WG.</desc>
