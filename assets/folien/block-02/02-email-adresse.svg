<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Aufbau einer E-Mail-Adresse</title><desc id="d">Die Adresse thomas.weber@haus-lichtblick.de in drei Teilen: Name für den Empfänger, das @-Zeichen für „bei“, die Domain für die Firma. Darunter: keine Leerzeichen, Umlaute umschreiben wie in p.schoenfeld@fischer-immo.de, Punkt und Bindestrich genau übernehmen.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Aufbau einer E-Mail-Adresse</text>
<text x="640" y="180" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1E2430" text-anchor="middle">Eine E-Mail-Adresse ist wie eine Postanschrift – ein Tippfehler, und nichts kommt an.</text><rect x="150.0" y="220" width="380" height="100" rx="12" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="4"/><text x="340.0" y="288" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#0F6CBD" text-anchor="middle">thomas.weber</text><path d="M160.0 340 q0 14 14 14 h166.0 l10 14 l10 -14 h166.0 q14 0 14 -14" fill="none" stroke="#0F6CBD" stroke-width="3"/><text x="340.0" y="404" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0F6CBD" text-anchor="middle">Name</text><text x="340.0" y="436" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">wer die E-Mail bekommt</text><rect x="540.0" y="220" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#E8A33D" stroke-width="4"/><text x="590.0" y="288" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#E8A33D" text-anchor="middle">@</text><path d="M550.0 340 q0 14 14 14 h26.0 l10 14 l10 -14 h26.0 q14 0 14 -14" fill="none" stroke="#E8A33D" stroke-width="3"/><text x="590.0" y="404" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8A33D" text-anchor="middle">„bei“</text><text x="590.0" y="436" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">gesprochen: „ät“</text><rect x="650.0" y="220" width="480" height="100" rx="12" fill="#FFFFFF" stroke="#107C41" stroke-width="4"/><text x="890.0" y="288" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#107C41" text-anchor="middle">haus-lichtblick.de</text><path d="M660.0 340 q0 14 14 14 h216.0 l10 14 l10 -14 h216.0 q14 0 14 -14" fill="none" stroke="#107C41" stroke-width="3"/><text x="890.0" y="404" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="middle">Domain</text><text x="890.0" y="436" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">Firma – wie Ort und Postleitzahl</text><rect x="140" y="480" width="1000" height="150" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="170" y="522" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Darauf achten</text><circle cx="182" cy="556" r="5" fill="#E8A33D"/><text x="200" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">keine Leerzeichen</text><circle cx="182" cy="586" r="5" fill="#E8A33D"/><text x="200" y="593" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Umlaute umschreiben: Schönfeld → schoenfeld</text><circle cx="182" cy="616" r="5" fill="#E8A33D"/><text x="200" y="623" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Punkt und Bindestrich genau übernehmen</text><text x="1110" y="598" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0F6CBD" text-anchor="end">p.schoenfeld@fischer-immo.de</text>
<line x1="60" y1="660" x2="1220" y2="660" stroke="#D5DAE1" stroke-width="2"/>
<text x="60" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">Block 02 · E-Mail-Grundlagen</text>
<text x="1220" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="end">Haus Lichtblick – Microsoft 365  ·  Folie 2</text>
</svg>
