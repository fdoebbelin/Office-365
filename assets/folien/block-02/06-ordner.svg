<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Ordnung mit Ordnern</title><desc id="d">Links der Ordnerbereich: unter Posteingang die Unterordner Hausverwaltung, Störungsmeldungen und Wartung; eine E-Mail wird mit der Maus auf den Ordner Störungsmeldungen gezogen. Rechts vier Schritte: Rechtsklick auf Posteingang, Neuen Unterordner erstellen, Namen tippen und Enter, E-Mail auf den Ordner ziehen. Vergleich: wie Aktenordner nach Themen.</desc>
