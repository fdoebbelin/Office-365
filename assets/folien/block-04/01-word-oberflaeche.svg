<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Word auf einen Blick</title><desc id="d">Schema des Word-Fensters: oben die Titelleiste mit AutoSpeichern und dem Dateinamen, darunter die Registerkarten Datei, Start, Einfügen, Layout, Überprüfen, Ansicht und das Menüband mit der Gruppe Schriftart (Aptos, 11, F, K, U) und dem Absatzzeichen. Darunter das Lineal, die Seite mit dem Aushang „Aufzug außer Betrieb“ und unten die Statusleiste mit Seitenzahl, Wörtern, Sprache und Zoom.</desc>
