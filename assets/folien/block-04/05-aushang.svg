<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Vom Rohtext zum Aushang</title><desc id="d">Links der Rohtext des Aushangs „Aufzug außer Betrieb“ in kleiner, einheitlicher Schrift mit leeren Absätzen. Rechts derselbe Aushang formatiert: Titel groß, fett und zentriert, Untertitel fett, Text größer, die Worte „den ganzen Tag“ fett, der Kontakt zum Hausmeister kursiv. Daneben die Schritte: Titel groß und fett, zentriert, Text 14 bis 16 pt, Wichtiges fett, leere Absätze weg.</desc>
