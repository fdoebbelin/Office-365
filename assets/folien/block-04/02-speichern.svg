<title id="t">Speichern: Ordnung wie im Aktenschrank</title><desc id="d">Oben der Vergleich: PC ist der Aktenschrank, der Ordner die Schublade, die Datei die Akte – Beispiel Dokumente, Haus-Lichtblick, Aushang-Aufzug.docx. Rechts die Schritte: Strg+S, Namen vergeben, Ort wählen über Weitere Speicheroptionen, Speichern. Unten gute Dateinamen wie Aushang-Aufzug und schlechte wie Dokument1 oder Namen mit Schrägstrich.</desc>
