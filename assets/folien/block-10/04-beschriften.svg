<title id="t">Titel und Achsentitel</title><desc id="d">Ein Säulendiagramm mit dem Titel Stromverbrauch Haus Lichtblick 2025, der senkrechten Achsenbeschriftung Verbrauch in kWh und der waagerechten Achsenbeschriftung Monat. Rechts daneben die Schaltfläche Plus für Diagrammelemente mit Häkchen bei Achsen, Achsentitel, Diagrammtitel und Gitternetzlinien. Alternativ im Menüband: Diagrammentwurf, Diagrammelement hinzufügen, Achsentitel – erscheint nur, wenn das Diagramm markiert ist.</desc>
