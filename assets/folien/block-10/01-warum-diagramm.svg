<title id="t">Warum ein Diagramm?</title><desc id="d">Links die Tabelle mit dem Stromverbrauch 2025 von Januar 4.850 bis Dezember 4.530 kWh, rechts dieselben Werte als Säulendiagramm; der höchste Wert im Januar und der niedrigste im August sind rot hervorgehoben. Aussage: Die Tabelle sagt, was da ist; das Diagramm zeigt sofort, wo es hoch und wo es niedrig ist – Winter hoch, Sommer niedrig.</desc>
