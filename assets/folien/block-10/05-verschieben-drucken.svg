<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Verschieben, Größe ändern, drucken</title><desc id="d">Links ein markiertes Diagramm mit acht Anfassern: am Rand ziehen verschiebt es, an einer Ecke ziehen ändert die Größe. Rechts das Drucken: Diagramm anklicken, Strg+P, Einstellung „Ausgewähltes Diagramm drucken“, die Vorschau zeigt nur das Diagramm auf einer ganzen Seite. Hinweis: Einmal klicken markiert, Doppelklick öffnet den Bereich zum Formatieren; ändert sich eine Zahl in der Tabelle, ändert sich das Diagramm mit.</desc>
