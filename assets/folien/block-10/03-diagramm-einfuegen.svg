<title id="t">Ein Säulendiagramm einfügen</title><desc id="d">Links eine Tabelle mit Monat und Verbrauch; Überschriften und Zahlen sind markiert. Rechts Schritt 2: Einfügen, Gruppe Diagramme, Säulen- oder Balkendiagramm einfügen, und Schritt 3: unter 2D-Säule „Gruppierte Säulen“ anklicken. Darunter das fertige Säulendiagramm, das jetzt beschriftet wird.</desc>
