41" stroke="none" stroke-width="2"/><rect x="398.0" y="295" width="110" height="22" rx="2" fill="#107C41" stroke="none" stroke-width="2"/><rect x="398.0" y="325" width="170" height="22" rx="2" fill="#107C41" stroke="none" stroke-width="2"/><rect x="398.0" y="355" width="80" height="22" rx="2" fill="#107C41" stroke="none" stroke-width="2"/><text x="488.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">wie Säulen, liegend –</text><text x="488.0" y="466" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">gut bei langen Namen</text><line x1="376" y1="495" x2="600" y2="495" stroke="#D5DAE1" stroke-width="2"/><text x="488.0" y="530" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="488.0" y="562" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#107C41" text-anchor="middle">Fläche je Mieter</text><rect x="644" y="150" width="272" height="470" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M644 164 a14 14 0 0 1 14 -14 h244 a14 14 0 0 1 14 14 v50 h-272 z" fill="#107C41"/><text x="780.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Linie</text><polyline points="690.0,370 735.0,340 780.0,325 825.0,295 870.0,270" fill="none" stroke="#107C41" stroke-width="5"/><text x="780.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Verlauf über die Zeit</text><text x="780.0" y="466" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">zeigen</text><line x1="668" y1="495" x2="892" y2="495" stroke="#D5DAE1" stroke-width="2"/><text x="780.0" y="530" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="780.0" y="562" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#107C41" text-anchor="middle">Zählerstand Jan–Dez</text><rect x="936" y="150" width="272" height="470" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M936 164 a14 14 0 0 1 14 -14 h244 a14 14 0 0 1 14 14 v50 h-272 z" fill="#107C41"/><text x="1072.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kreis</text><path d="M1072.0 320 L1072.0 250.0 A70 70 0 0 1 1136.2 347.9 z" fill="#107C41" stroke="#FFFFFF" stroke-width="2"/><path d="M1072.0 320 L1136.2 347.9 A70 70 0 0 1 1048.4 385.9 z" fill="#5DA87A" stroke="#FFFFFF" stroke-width="2"/><path d="M1072.0 320 L1048.4 385.9 A70 70 0 0 1 1022.2 270.8 z" fill="#A8D5B8" stroke="#FFFFFF" stroke-width="2"/><path d="M1072.0 320 L1022.2 270.8 A70 70 0 0 1 1072.0 250.0 z" fill="#1F3A5F" stroke="#FFFFFF" stroke-width="2"/><text x="1072.0" y="440" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Anteile an einem Ganzen</text><text x="1072.0" y="466" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">(höchstens 5–6 Teile)</text><line x1="960" y1="495" x2="1184" y2="495" stroke="#D5DAE1" stroke-width="2"/><text x="1072.0" y="530" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#5B6472" text-anchor="middle">Im Haus Lichtblick</text><text x="1072.0" y="562" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#107C41" text-anchor="middle">Fläche je Etage</text>
