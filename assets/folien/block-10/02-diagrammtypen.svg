<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Welches Diagramm wofür?</title><desc id="d">Vier Karten: Säulen vergleichen Werte, etwa den Stromverbrauch je Monat; Balken sind liegende Säulen und gut bei langen Namen, etwa Fläche je Mieter; Linien zeigen einen Verlauf über die Zeit, etwa den Zählerstand; Kreise zeigen Anteile an einem Ganzen mit höchstens fünf bis sechs Teilen, etwa die Fläche je Etage.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
