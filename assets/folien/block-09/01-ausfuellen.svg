<title id="t">Formeln nach unten ausfüllen</title><desc id="d">Eine Liste mit Monat, Zählerstand und Verbrauch. In C3 steht =B3-B2; mit dem Ausfüllkästchen – dem kleinen Quadrat unten rechts an der Zelle – wird die Formel nach unten gezogen, und Excel passt die Adressen an: =B4-B3, =B5-B4, =B6-B5. Schritte: Zelle anklicken, Maus auf das Quadrat, nach unten ziehen oder doppelklicken.</desc>
