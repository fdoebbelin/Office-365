 fill="#1E2430" text-anchor="start">das kleine Quadrat unten rechts an der Zelle</text><circle cx="672" cy="278" r="16" fill="#107C41"/><text x="672" y="285" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="700" y="286" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Zelle mit der Formel anklicken</text><circle cx="672" cy="320" r="16" fill="#107C41"/><text x="672" y="327" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="700" y="328" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Maus auf das Quadrat: dünnes schwarzes Kreuz</text><circle cx="672" cy="362" r="16" fill="#107C41"/><text x="672" y="369" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="700" y="370" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">mit gedrückter Maustaste nach unten ziehen</text><circle cx="672" cy="404" r="16" fill="#107C41"/><text x="672" y="411" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="700" y="412" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">oder: doppelklicken – Excel füllt bis zum Listenende</text><rect x="60" y="525" width="1160" height="100" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">Excel denkt in