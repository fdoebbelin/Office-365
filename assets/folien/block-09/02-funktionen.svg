<title id="t">SUMME, MITTELWERT, MIN, MAX, ANZAHL</title><desc id="d">Aufbau einer Funktion: =SUMME(C4:C15), der Bereich reicht von C4 bis C15, der Doppelpunkt heißt bis. Fünf Funktionen mit Ergebnis für den Stromverbrauch 2025: SUMME zählt alles zusammen, 47.850 kWh; MITTELWERT ist der Durchschnitt, 3.987,5 kWh; MIN der kleinste Wert, 3.240 kWh; MAX der größte, 4.850 kWh; ANZAHL zählt die Zellen mit Zahlen, 12.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">SUMME, MITTELWERT, MIN, MAX, ANZAHL</text>
<text x="60" y="175" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1E2430" text-anchor="start">Aufbau:  =SUMME(C4:C15)</text><text x="470" y="210" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">Bereich: von C4 bis C15 – der Doppelpunkt heißt „bis“</text><rect x="60" y="240" width="1160" height="64" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="85" y="281" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="start">SUMME</text><text x="330" y="281" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">alles zusammenzählen</text><text x="640" y="281" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">wie der Kassenzettel</text><text x="1195" y="281" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="end">47.850 kWh</text><rect x="60" y="316" width="1160" height="64" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="85" y="357" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="start">MITTELWERT</text><text x="330" y="357" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Durchschnitt</text><text x="640" y="357" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">Was verbrauchen wir normalerweise?</text><text x="1195" y="357" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="end">3.987,5 kWh</text><rect x="60" y="392" width="1160" height="64" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="85" y="433" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="start">MIN</text><text x="330" y="433" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">kleinster Wert</text><text x="640" y="433" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">der sparsamste Monat</text><text x="1195" y="433" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="end">3.240 kWh</text><rect x="60" y="468" width="1160" height="64" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="85" y="509" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="start">MAX</text><text x="330" y="509" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">größter Wert</text><text x="640" y="509" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">der teuerste Monat</text><text x="1195" y="509" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="end">4.850 kWh</text><rect x="60" y="544" width="1160" height="64" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="85" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="start">ANZAHL</text><text x="330" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Zellen mit Zahlen zählen</text><text x="640" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">Wie viele Monate sind erfasst?</text><text x="1195" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="end">12</text>
