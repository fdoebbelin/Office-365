<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Zahlen formatieren</title><desc id="d">Drei Beispiele: 7140 wird im Format Währung zu 7.140,00 €, 47850 mit 1.000er-Trennzeichen zu 47.850, die Zahl 45762 im Format Datum kurz zu 15.04.2025. Rechts die Auswahl auf der Registerkarte Start in der Gruppe Zahl mit Standard, Zahl, Währung, Datum kurz, Prozent und der Schaltfläche 1.000er-Trennzeichen. Merksatz: Das Format ändert nur die Anzeige, der Wert bleibt gleich.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Zahlen formatieren</text>
<text x="60" y="175" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E2430" text-anchor="start">Das Format ändert nur die Anzeige – der Wert bleibt gleich.</text><rect x="60" y="215" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="245" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Standard</text><text x="340" y="277" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="end">7140</text><path d="M375 255 h70" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="460" y="215" width="420" height="80" rx="8" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="480" y="245" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Währung</text><text x="860" y="277" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#107C41" text-anchor="end">7.140,00 €</text><rect x="60" y="320" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="350" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Standard</text><text x="340" y="382" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="end">47850</text><path d="M375 360 h70" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="460" y="320" width="420" height="80" rx="8" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="480" y="350" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Zahl mit 1.000er-Trennzeichen</text><text x="860" y="382" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#107C41" text-anchor="end">47.850</text><rect x="60" y="425" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="455" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Standard</text><text x="340" y="487" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="end">45762</text><path d="M375 465 h70" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="460" y="425" width="420" height="80" rx="8" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="480" y="455" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#5B6472" text-anchor="start">Datum, kurz</text><text x="860" y="487" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#107C41" text-anchor="end">15.04.2025</text><rect x="920" y="215" width="300" height="290" rx="10" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1.5"/><text x="945" y="255" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="start">Start → Gruppe „Zahl“</text><rect x="945" y="275" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="957" y="299" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Standard</text><text x="1182" y="299" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="end">▾</text><text x="957" y="340" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Zahl</text><text x="957" y="374" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1E2430" text-anchor="start">Währung</text><text x="957" y="408" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Datum, kurz</text><text x="957" y="442" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Prozent</text><rect x="945" y="465" width="36" height="30" rx="4" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="963" y="486" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1E2430" text-anchor="middle">000</text><text x="990" y="487" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1E2430" text-anchor="start">1.000er-Trennzeichen</text><rect x="60" y="540" width="1160" height="85" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="578" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">Zellen markieren, dann Format wählen.</text><text x="90" y="608" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Ein Datum ist für Excel eine Zahl – deshalb kann Excel damit rechnen.</text>
