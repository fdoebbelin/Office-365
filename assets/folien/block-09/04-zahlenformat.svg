<text x="1220" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="end">Haus Lichtblick – Microsoft 365  ·  Folie 4</text>
