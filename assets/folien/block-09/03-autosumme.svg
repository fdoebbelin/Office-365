<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Schneller mit AutoSumme</title><desc id="d">Die Schaltfläche AutoSumme mit dem Summenzeichen auf den Registerkarten Start und Formeln; der kleine Pfeil daneben bietet Mittelwert, Anzahl, Max und Min. Beispiel: Unter dem Verbrauch von Oktober bis Dezember schlägt Excel =SUMME(B2:B4) vor und umrahmt den Bereich gestrichelt. Schritte: Zelle unter der Zahlenreihe anklicken, AutoSumme klicken, Bereich prüfen, Enter.</desc>
