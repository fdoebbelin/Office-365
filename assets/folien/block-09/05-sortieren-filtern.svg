<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Sortieren und Filtern</title><desc id="d">Links die gefilterte Inventarliste: nur Glasreiniger und Einweghandschuhe mit Nachbestellen Ja sind zu sehen, die Zeilennummern springen – die übrigen Zeilen sind nur ausgeblendet. In der Mitte das Filtermenü einer Spalte mit Sortierbefehlen und Häkchen für (Alle auswählen), Ja und Nein. Rechts: Sortieren über Daten, Sortieren; Filtern über Daten, Filtern; Filter aufheben durch erneuten Klick. Hinweis: vor dem Sortieren nur eine Zelle anklicken, Excel erkennt die ganze Liste, so bleiben die Zeilen zusammen.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Sortieren und Filtern</text>
<rect x="60" y="160" width="40" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><rect x="100" y="160" width="200" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="200.0" y="194.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">A</text><rect x="300" y="160" width="110" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="355.0" y="194.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">B</text><rect x="410" y="160" width="170" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="495.0" y="194.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">C</text><rect x="60" y="210" width="40" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="80" y="244.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F6CBD" text-anchor="middle">3</text><rect x="100" y="210" width="200" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="108" y="244.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="start">Artikel ▾</text><rect x="300" y="210" width="110" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="402" y="244.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="end">Bestand ▾</text><rect x="410" y="210" width="170" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="418" y="244.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1E2430" text-anchor="start">Nachbestellen ▾</text><rect x="60" y="260" width="40" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="80" y="294.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F6CBD" text-anchor="middle">8</text><rect x="100" y="260" width="200" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="108" y="294.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Glasreiniger</text><rect x="300" y="260" width="110" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="402" y="294.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="end">8</text><rect x="410" y="260" width="170" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="418" y="294.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Ja</text><rect x="60" y="310" width="40" height="50" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="80" y="344.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#0F6CBD" text-anchor="middle">12</text><rect x="100" y="310" width="200" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="108" y="344.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Einweghandschuhe</text><rect x="300" y="310" width="110" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="402" y="344.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="end">5</text><rect x="410" y="310" width="170" height="50" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="418" y="344.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Ja</text><text x="60" y="400" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Die Zeilennummern springen (3, 8, 12):</text><text x="60" y="428" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Die übrigen Zeilen sind nur ausgeblendet,</text><text x="60" y="456" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1E2430" text-anchor="start">nicht gelöscht.</text><rect x="600" y="160" width="290" height="250" rx="6" fill="#FFFFFF" stroke="#5B6472" stroke-width="2"/><text x="616" y="190" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1E2430" text-anchor="start">Nach Größe sortieren (aufsteigend)</text><text x="616" y="220" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1E2430" text-anchor="start">Nach Größe sortieren (absteigend)</text><line x1="610" y1="240" x2="880" y2="240" stroke="#D5DAE1" stroke-width="1.5"/><rect x="616" y="259" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#5B6472" stroke-width="2"/><text x="646" y="275" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">(Alle auswählen)</text><rect x="616" y="295" width="20" height="20" rx="3" fill="#107C41" stroke="#107C41" stroke-width="2"/><path d="M620 305 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="3" fill="none"/><text x="646" y="311" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Ja</text><rect x="616" y="331" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#5B6472" stroke-width="2"/><text x="646" y="347" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Nein</text><rect x="770" y="370" width="100" height="30" rx="5" fill="#107C41" stroke="none" stroke-width="2"/><text x="820" y="391" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OK</text><text x="920" y="185" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="start">Sortieren</text><text x="920" y="213" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Zelle in der Spalte anklicken</text><text x="920" y="237" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">→ Daten → Sortieren</text><text x="920" y="285" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="start">Filtern</text><text x="920" y="313" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Daten</text><text x="920" y="337" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">→ Filtern: Pfeile in der Kopfzeile</text><text x="920" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="start">Filter aufheben</text><text x="920" y="413" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">Daten</text><text x="920" y="437" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1E2430" text-anchor="start">→ Filtern noch einmal klicken</text><rect x="60" y="500" width="1160" height="120" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="540" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1E2430" text-anchor="start">Sortieren ändert die Reihenfolge, Filtern blendet Zeilen aus.</text><text x="90" y="575" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Vor dem Sortieren nur EINE Zelle der Spalte anklicken, nicht die Spalte markieren.</text><text x="90" y="603" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Excel erkennt die ganze Liste von selbst – so bleiben die Zeilen zusammen.</text>
