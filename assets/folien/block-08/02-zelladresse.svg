<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Zellen und Adressen</title><desc id="d">Links ein Raster mit den Spalten A bis E und den Zeilen 1 bis 6; Spalte C und Zeile 4 sind hervorgehoben, wo sie sich kreuzen, liegt die Zelle C4. Rechts die Tasten zum Bewegen: Pfeiltasten eine Zelle weiter, Enter nach unten, Tab nach rechts, Strg+Pos1 zurück nach A1, Namenfeld – Adresse tippen und Enter. Vergleich: wie ein Planquadrat auf dem Stadtplan.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
