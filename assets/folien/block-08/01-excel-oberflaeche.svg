<title id="t">Excel auf einen Blick</title><desc id="d">Schema des Excel-Fensters: oben die Registerkarten Datei, Start, Einfügen, Seitenlayout, Formeln, Daten, Ansicht und das Menüband, darunter links das Namenfeld mit C2 und rechts die Bearbeitungsleiste mit dem Inhalt 15. Darunter das Tabellenraster mit Spaltenköpfen A bis G und Zeilennummern, die aktive Zelle C2 ist grün umrandet. Unten das Tabellenblatt „Inventar“.</desc>
