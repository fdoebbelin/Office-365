<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Spaltenbreite und Kopfzeile</title><desc id="d">Links: Doppelklick auf die Trennlinie zwischen zwei Spaltenköpfen passt die Spalte dem längsten Eintrag an, oder man zieht mit gedrückter Maustaste. Rechts: Die Kopfzeile Artikel, Lagerort, Bestand wird markiert und mit Fett (Strg+Umschalt+F) und Füllfarbe hervorgehoben. Unten: mehrere Spalten markieren und auf eine Trennlinie doppelklicken.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Spaltenbreite und Kopfzeile</text>
<rect x="80" y="170" width="40" height="44" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><rect x="120" y="170" width="150" height="44" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="195.0" y="200" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">A</text><rect x="270" y="170" width="220" height="44" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="380.0" y="200" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="middle">B</text><line x1="270" y1="160" x2="270" y2="225" stroke="#107C41" stroke-width="4"/><path d="M245 192 h-14 l8 -6 m-8 6 l8 6 M295 192 h14 l-8 -6 m8 6 l-8 6" stroke="#107C41" stroke-width="3" fill="none"/><text x="80" y="260" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">Doppelklick auf die Trennlinie im Spaltenkopf:</text><text x="80" y="292" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Die Spalte passt sich dem längsten Eintrag an.</text><text x="80" y="324" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Oder mit gedrückter Maustaste ziehen.</text><rect x="660" y="160" width="40" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><rect x="700" y="160" width="200" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="800.0" y="192.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">A</text><rect x="900" y="160" width="180" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="990.0" y="192.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">B</text><rect x="1080" y="160" width="110" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="1135.0" y="192.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">C</text><rect x="660" y="208" width="40" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="680" y="240.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">1</text><rect x="700" y="208" width="200" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="708" y="240.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1E2430" text-anchor="start">Artikel</text><rect x="900" y="208" width="180" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="908" y="240.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1E2430" text-anchor="start">Lagerort</text><rect x="1080" y="208" width="110" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="1182" y="240.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1E2430" text-anchor="end">Bestand</text><rect x="660" y="256" width="40" height="48" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="680" y="288.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">2</text><rect x="700" y="256" width="200" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="708" y="288.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Allzweckreiniger</text><rect x="900" y="256" width="180" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="908" y="288.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Lagerraum EG-01</text><rect x="1080" y="256" width="110" height="48" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="1182" y="288.64" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="end">15</text><rect x="700" y="208" width="490" height="48" fill="#107C41" fill-opacity="0.18"/><text x="660" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">Kopfzeile: markieren, dann</text><rect x="660" y="355" width="46" height="42" rx="6" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="683" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">F</text><text x="722" y="384" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Fett · Strg+Umschalt+F</text><rect x="660" y="413" width="46" height="42" rx="6" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="683" y="443" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="middle">▰</text><text x="722" y="442" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Füllfarbe · Start → Schriftart</text><rect x="60" y="500" width="1160" height="120" rx="12" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="90" y="540" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">Mehrere Spalten auf einmal: Spaltenköpfe A bis E markieren,</text><text x="90" y="574" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="start">dann auf eine der Trennlinien doppelklicken.</text><text x="90" y="606" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">Wie beim Kleiderschrank: Jede Spalte bekommt so viel Platz, wie sie braucht.</text>
