<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Die erste Formel</title><desc id="d">In Zelle F2 steht die Formel =C2-D2: Bestand 8 minus Mindestmenge 10 ergibt minus 2. Die Schritte: Gleichheitszeichen tippen, Zelle C2 anklicken, Minus tippen, Zelle D2 anklicken, Enter. Ein negatives Ergebnis heißt: weniger als die Mindestmenge, nachbestellen. Ändert sich der Bestand, rechnet Excel sofort neu.</desc>
