oke-width="2"/><text x="399" y="494" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="middle">Zelle C2 anklicken</text><path d="M509 485 h12" stroke="#E8A33D" stroke-width="4" marker-end="url(#pf)"/><rect x="524" y="450" width="215" height="70" rx="10" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="631" y="494" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="middle">- tippen</text><path d="M741 485 h12" stroke="#E8A33D" stroke-width="4" marker-end="url(#pf)"/><rect x="756" y="450" width="215" height="70" rx="10" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="863" y="494" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="middle">Zelle D2 anklicken</text><path d="M973 485 h12" stroke="#E8A33D" stroke-width="4" marker-end="url(#pf)"/><rect x="988" y="450" width="215" height="70" rx="10" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="1095" y="494" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="middle">Enter</text><text x="60" y="580" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#B3261E" text-anchor="start">Negativ heißt: weniger als die Mindestmenge – nachbestellen.</text><text x="60" y="614" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Ändert sich der Bestand, rechnet Excel sofort neu.</text>
