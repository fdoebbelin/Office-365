<title id="t">Text, Zahlen und Datum eingeben</title><desc id="d">Ein kleines Raster: Text wie „Glasreiniger“ steht links, Zahlen wie 8 und das Datum 15.04.2025 stehen rechts; eine zu schmale Spalte zeigt ######. Darunter: Zelle anklicken, tippen, mit Enter oder Tab bestätigen; Datum mit Punkten eingeben; Inhalt ändern mit neu tippen, F2 oder in der Bearbeitungsleiste; Esc bricht ab, Entf leert die Zelle.</desc>
