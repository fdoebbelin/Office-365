<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Woran Sie denken</title><desc id="d">Zwei Spalten mit Häkchen. Outlook: Betreff mit Was und Wo, An für die Person, die etwas tun soll, Cc für die, die Bescheid wissen soll, nur eigene Adressen, Erinnerung einen Tag vorher, Ordner statt Stapel. Word: erst markieren, dann formatieren, Titel groß und Wichtiges fett, Überschrift 1 und 2 aus den Formatvorlagen, in der Tabelle springt Tab weiter, keine leeren Absätze, früh und oft Strg+S.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
