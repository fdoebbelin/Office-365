<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Ein Fall, fünf Schritte</title><desc id="d">Ausgangspunkt: Tim Rauch von der Lernwerk Akademie im 3. OG meldet kalte Heizkörper. Fünf Stationen: 1 E-Mail – Auftrag an Heizungstechnik Berlin mit der Hausverwaltung in Cc (Block 02); 2 Termin – Prüfung durch den Techniker mit Erinnerung (Block 03); 3 Aushang – Information für die Mieter im 3. OG (Block 04); 4 Protokoll – Störung mit Überschriften und Tabelle festhalten (Block 05); 5 Ordnung – E-Mails in den Ordner Störungsmeldungen (Block 02).</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Ein Fall, fünf Schritte</text>
<text x="60" y="175" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Tim Rauch (Lernwerk Akademie, 3. OG): „Bei uns bleiben die Heizkörper kalt.“</text><rect x="60" y="215" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M60 229 a14 14 0 0 1 14 -14 h186 a14 14 0 0 1 14 14 v56 h-214 z" fill="#0F6CBD"/><circle cx="94" cy="250" r="18" fill="#FFFFFF"/><text x="94" y="257" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F6CBD" text-anchor="middle">1</text><text x="122" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start">E-Mail</text><text x="167.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Auftrag an</text><text x="167.0" y="362" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Heizungstechnik</text><text x="167.0" y="394" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Berlin, Cc</text><text x="167.0" y="426" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Hausverwaltung</text><text x="167.0" y="520" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6472" text-anchor="middle">Block 02</text><path d="M276 380 h18" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="296" y="215" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M296 229 a14 14 0 0 1 14 -14 h186 a14 14 0 0 1 14 14 v56 h-214 z" fill="#0F6CBD"/><circle cx="330" cy="250" r="18" fill="#FFFFFF"/><text x="330" y="257" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F6CBD" text-anchor="middle">2</text><text x="358" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start">Termin</text><text x="403.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Prüfung</text><text x="403.0" y="362" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">durch den Techniker</text><text x="403.0" y="394" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">mit Erinnerung</text><text x="403.0" y="426" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle"></text><text x="403.0" y="520" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6472" text-anchor="middle">Block 03</text><path d="M512 380 h18" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="532" y="215" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M532 229 a14 14 0 0 1 14 -14 h186 a14 14 0 0 1 14 14 v56 h-214 z" fill="#185ABD"/><circle cx="566" cy="250" r="18" fill="#FFFFFF"/><text x="566" y="257" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#185ABD" text-anchor="middle">3</text><text x="594" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start">Aushang</text><text x="639.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Information</text><text x="639.0" y="362" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">für die Mieter</text><text x="639.0" y="394" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">im 3. OG</text><text x="639.0" y="426" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle"></text><text x="639.0" y="520" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6472" text-anchor="middle">Block 04</text><path d="M748 380 h18" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="768" y="215" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M768 229 a14 14 0 0 1 14 -14 h186 a14 14 0 0 1 14 14 v56 h-214 z" fill="#185ABD"/><circle cx="802" cy="250" r="18" fill="#FFFFFF"/><text x="802" y="257" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#185ABD" text-anchor="middle">4</text><text x="830" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start">Protokoll</text><text x="875.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Störung mit</text><text x="875.0" y="362" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Überschriften</text><text x="875.0" y="394" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">und Tabelle</text><text x="875.0" y="426" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">festhalten</text><text x="875.0" y="520" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6472" text-anchor="middle">Block 05</text><path d="M984 380 h18" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="1004" y="215" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M1004 229 a14 14 0 0 1 14 -14 h186 a14 14 0 0 1 14 14 v56 h-214 z" fill="#0F6CBD"/><circle cx="1038" cy="250" r="18" fill="#FFFFFF"/><text x="1038" y="257" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F6CBD" text-anchor="middle">5</text><text x="1066" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="start">Ordnung</text><text x="1111.0" y="330" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">E-Mails in den</text><text x="1111.0" y="362" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">Ordner</text><text x="1111.0" y="394" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle">„Störungsmeldungen“</text><text x="1111.0" y="426" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="middle"></text><text x="1111.0" y="520" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#5B6472" text-anchor="middle">Block 02</text><rect x="60" y="570" width="1160" height="55" rx="10" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="640" y="606" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E2430" text-anchor="middle">Ein Fall, fünf Schritte – alles, was Sie in Block 02 bis 05 gelernt haben.</text>
