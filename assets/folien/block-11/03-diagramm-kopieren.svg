<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Ein Diagramm von Excel nach Word</title><desc id="d">Links in Excel ist das Säulendiagramm am Rand angeklickt und mit Strg+C kopiert. Rechts in Word steht es nach Strg+V in einer leeren Zeile; daneben die Einfügeoptionen, unter anderem eingebettet, verknüpft und Bild. Hinweis: Word nimmt das Diagramm mit seinen Daten mit; ändern sich die Zahlen in Excel, wird das Diagramm neu kopiert; wer nur ein Foto will, wählt die Option Bild.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
