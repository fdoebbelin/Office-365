1"/><text x="1159" y="306" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1E2430" text-anchor="middle">eingeb.</text><rect x="1062" y="332" width="58" height="42" rx="5" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="1091" y="358" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1E2430" text-anchor="middle">Verkn.</text><rect x="1130" y="332" width="58" height="42" rx="5" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="1159" y="358" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1E2430" text-anchor="middle">Bild</text><rect x="60" y="520" width="1160" height="100" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="558" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">Word nimmt das Diagramm mit seinen Daten mit („eingebettet“).</text><text x="90" y="592" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Ändern sich die Zahlen in Excel, kopieren Sie das Diagramm neu. Wer nur ein Foto will: Einfügeoption „Bild“.</text>
