<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Den Bericht als Anhang versenden</title><desc id="d">Schema einer neuen E-Mail im neuen Outlook: Registerkarte Einfügen, Schaltfläche Datei anfügen mit dem Eintrag Diesen PC durchsuchen; An mit der eigenen Adresse, Betreff Jahresbericht Facility Management 2025 – Haus Lichtblick, darunter der Anhang Jahresbericht-2025.docx. Rechts fünf Schritte: Bericht speichern, neue E-Mail mit An und Betreff, Einfügen und Datei anfügen, Diesen PC durchsuchen und Datei doppelklicken, Anhang prüfen und senden. Alternative: Datei aus dem Explorer in die E-Mail ziehen.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
