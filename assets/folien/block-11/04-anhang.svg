ily="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1E2430" text-anchor="start">Jahresbericht Facility Management 2025 – Haus Lichtblick</text><rect x="160" y="410" width="300" height="44" rx="6" fill="#E6F0FA" stroke="#185ABD" stroke-width="2"/><rect x="172" y="418" width="26" height="28" rx="3" fill="#185ABD" stroke="none" stroke-width="2"/><text x="185" y="438" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">W</text><text x="210" y="438" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1E2430" text-anchor="start">Jahresbericht-2025.docx</text><rect x="538.16" y="418" width="83.67999999999999" height="34" rx="17.0" fill="#0F6CBD" stroke="none" stroke-width="2"/><text x="580.0" y="442" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Anhang</text><line x1="160" y1="480" x2="680" y2="480" stroke="#D5DAE1" stroke-width="6" stroke-linecap="round"/><line x1="160" y1="502" x2="590" y2="502" stroke="#D5DAE1" stroke-width="6" stroke-linecap="round"/><line x1="160" y1="524" x2="500" y2="524" stroke="#D5DAE1" stroke-width="6" stroke-linecap="round"/><circle cx="830" cy="185" r="20" fill="#0F6CBD"/><text x="830" y="192" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="862" y="193" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Bericht in Word speichern (Strg+S)</text><circle cx="830" cy="251" r="20" fill="#0F6CBD"/><text x="830" y="258" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="862" y="259" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Neue E-Mail, An und Betreff</text><circle cx="830" cy="317" r="20" fill="#0F6CBD"/><text x="830" y="324" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="862" y="325" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">„Einfügen“ → „Datei anfügen“</text><circle cx="830" cy="383" r="20" fill="#0F6CBD"/><text x="830" y="390" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="862" y="391" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">„Diesen PC durchsuchen“, Datei wählen</text><circle cx="830" cy="449" r="20" fill="#0F6CBD"/><text x="830" y="456" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="862" y="457" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Anhang prüfen, Senden</text><rect x="60" y="570" width="1160" height="55" rx="10" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="640" y="605" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Oder: Datei im Explorer anfassen und in die offene E-Mail ziehen.</text>
