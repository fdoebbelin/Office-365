<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Der ganze Ablauf</title><desc id="d">Links ein Bildschirm mit Excel und Word nebeneinander, angeordnet mit Windows-Taste und Pfeil links oder rechts. Rechts die Schritte zum Bericht: Excel und Word nebeneinander, Tabelle kopieren und einfügen, Diagramm kopieren und einfügen, Bericht speichern, E-Mail mit gutem Betreff, Bericht anhängen und senden. Merksatz: Erst speichern, dann anhängen – sonst geht der alte Stand hinaus.</desc>
