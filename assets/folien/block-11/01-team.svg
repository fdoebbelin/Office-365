<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Drei Programme als Team</title><desc id="d">Drei Karten mit Pfeilen: Excel sammelt Daten, rechnet und erstellt das Diagramm – Strg+C; Word nimmt Tabelle und Diagramm in den Bericht auf – Strg+V; Outlook versendet den Bericht als Anhang an die Hausverwaltung – Datei anfügen. Vergleich: Excel ist der Rechner, Word der Schreibtisch, Outlook der Briefkasten.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Drei Programme als Team</text>
<rect x="60" y="160" width="340" height="270" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M60 174 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v56 h-340 z" fill="#107C41"/><text x="230.0" y="206" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Excel</text><text x="230.0" y="280" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="middle">Daten sammeln</text><text x="230.0" y="314" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">rechnen,</text><text x="230.0" y="348" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">Diagramm</text><path d="M408 295 h52" stroke="#E8A33D" stroke-width="7" marker-end="url(#pf)"/><text x="230" y="470" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="middle">Strg+C</text><rect x="470" y="160" width="340" height="270" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M470 174 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v56 h-340 z" fill="#185ABD"/><text x="640.0" y="206" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Word</text><text x="640.0" y="280" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="middle">Bericht schreiben</text><text x="640.0" y="314" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">Tabelle und Diagramm</text><text x="640.0" y="348" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">einfügen</text><path d="M818 295 h52" stroke="#E8A33D" stroke-width="7" marker-end="url(#pf)"/><text x="640" y="470" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#185ABD" text-anchor="middle">Strg+V</text><rect x="880" y="160" width="340" height="270" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M880 174 a14 14 0 0 1 14 -14 h312 a14 14 0 0 1 14 14 v56 h-340 z" fill="#0F6CBD"/><text x="1050.0" y="206" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Outlook</text><text x="1050.0" y="280" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="middle">Bericht versenden</text><text x="1050.0" y="314" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">als Anhang</text><text x="1050.0" y="348" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">an die Hausverwaltung</text><text x="1050" y="470" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0F6CBD" text-anchor="middle">Datei anfügen</text><rect x="60" y="510" width="1160" height="110" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="552" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1E2430" text-anchor="start">Excel ist der Rechner, Word der Schreibtisch, Outlook der Briefkasten.</text><text x="90" y="590" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Im Haus Lichtblick: Stromzahlen → Jahresbericht → E-Mail an Petra Schönfeld</text>
