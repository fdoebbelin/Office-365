dth="1"/><text x="108" y="307.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Januar</text><rect x="240" y="278" width="180" height="44" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="412" y="307.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="end">4.850</text><rect x="60" y="322" width="40" height="44" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="80" y="351.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">3</text><rect x="100" y="322" width="140" height="44" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="108" y="351.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">Februar</text><rect x="240" y="322" width="180" height="44" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="412" y="351.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="end">4.670</text><rect x="60" y="366" width="40" height="44" rx="0" fill="#F3F5F8" stroke="#D5DAE1" stroke-width="1"/><text x="80" y="395.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">4</text><rect x="100" y="366" width="140" height="44" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="108" y="395.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#1E2430" text-anchor="start">…</text><rect x="240" y="366" width="180" height="44" rx="0" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1"/><text x="412" y="395.92" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="18" font-weight