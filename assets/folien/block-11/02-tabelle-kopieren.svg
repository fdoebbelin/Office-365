</text><text x="90" y="592" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Die Tabelle ist jetzt eine Word-Tabelle: Sie rechnet nicht mehr und ändert sich nicht mit Excel.</text>
