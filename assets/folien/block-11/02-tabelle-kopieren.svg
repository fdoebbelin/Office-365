<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Eine Tabelle von Excel nach Word</title><desc id="d">Links in Excel: die Tabelle mit Monat und Verbrauch ist markiert und mit Strg+C kopiert, ein laufender Rahmen zeigt das. Rechts in Word: unter der Überschrift Stromverbrauch 2025 steht nach Strg+V dieselbe Tabelle, daneben das kleine Symbol der Einfügeoptionen. Hinweis: Das Symbol muss man nicht anklicken; die Tabelle ist jetzt eine Word-Tabelle, sie rechnet nicht mehr und ändert sich nicht mit Excel.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
