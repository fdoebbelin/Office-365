<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Was der Selbsttest abfragt</title><desc id="d">Vier Spalten mit den Themen aus Block 02 bis 05. Outlook E-Mail: Oberfläche und Ordner; An, Cc, Bcc; Betreff; Antworten und Weiterleiten; Ordner. Outlook Kalender: Neues Ereignis; Termin, Besprechung, ganztägig; Erinnerung; Serie; Ändern und Löschen. Word Texte: Speichern; markieren und formatieren; Absatzzeichen und leere Absätze; Umschalt+Enter; Strg+Z. Word Struktur: Aufzählung und Nummerierung; Überschrift 1 und 2; Navigationsbereich; Tabellen; Seitenränder und Vorschau.</desc>
