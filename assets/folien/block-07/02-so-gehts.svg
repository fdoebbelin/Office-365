<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">So nutzen Sie den Selbsttest</title><desc id="d">Ein Kreislauf aus vier Schritten: 1 Beantworten ohne nachzusehen, 2 Prüfen mit den Lösungen, 3 Nachschlagen im genannten Block, 4 die passende Übung wiederholen. Daneben: Eine falsche Antwort ist ein Hinweis, wo sich ein zweiter Blick lohnt; was in Block 06 nachgeschlagen werden musste, besonders prüfen; Ziel 12 von 15 richtig, dann geht es mit Excel weiter.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">So nutzen Sie den Selbsttest</text>
<circle cx="400.0" cy="220.0" r="78" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="4"/><text x="400.0" y="200.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0F6CBD" text-anchor="middle">1</text><text x="400.0" y="230.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Beantworten</text><text x="400.0" y="256.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#5B6472" text-anchor="middle">ohne nachzusehen</text><path d="M521.6 285.3 l17.0 17.0" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><circle cx="570.0" cy="390.0" r="78" fill="#FFFFFF" stroke="#107C41" stroke-width="4"/><text x="570.0" y="370.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#107C41" text-anchor="middle">2</text><text x="570.0" y="400.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Prüfen</text><text x="570.0" y="426.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#5B6472" text-anchor="middle">mit den Lösungen</text><path d="M504.7 511.6 l-17.0 17.0" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><circle cx="400.0" cy="560.0" r="78" fill="#FFFFFF" stroke="#185ABD" stroke-width="4"/><text x="400.0" y="540.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#185ABD" text-anchor="middle">3</text><text x="400.0" y="570.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Nachschlagen</text><text x="400.0" y="596.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#5B6472" text-anchor="middle">im genannten Block</text><path d="M278.4 494.7 l-17.0 -17.0" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><circle cx="230.0" cy="390.0" r="78" fill="#FFFFFF" stroke="#E8A33D" stroke-width="4"/><text x="230.0" y="370.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8A33D" text-anchor="middle">4</text><text x="230.0" y="400.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1E2430" text-anchor="middle">Wiederholen</text><text x="230.0" y="426.0" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#5B6472" text-anchor="middle">die passende Übung</text><path d="M295.3 268.4 l17.0 -17.0" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="180" width="520" height="430" rx="14" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="730" y="225" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E2430" text-anchor="start">Ehrlich zu sich sein</text><text x="730" y="275" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Eine falsche Antwort ist kein</text><text x="730" y="311" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Fehler, sondern ein Hinweis:</text><text x="730" y="347" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Hier lohnt sich ein zweiter Blick.</text><text x="730" y="383" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start"></text><text x="730" y="419" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Was Sie in Block 06 nachschlagen</text><text x="730" y="455" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">mussten, prüfen Sie hier besonders.</text><text x="730" y="491" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start"></text><text x="730" y="527" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">Ziel: 12 von 15 richtig – dann</text><text x="730" y="563" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">geht es mit Excel weiter.</text>
<line x1="60" y1="660" x2="1220" y2="660" stroke="#D5DAE1" stroke-width="2"/>
<text x="60" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">Block 07 · Selbsttest Outlook und Word</text>
<text x="1220" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="end">Haus Lichtblick – Microsoft 365  ·  Folie 2</text>
</svg>
