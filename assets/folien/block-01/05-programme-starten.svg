<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Programme starten</title><desc id="d">Drei Schritte als Pfeile: Startmenü öffnen, Programm suchen, Programm anklicken. Tipp: Die Windows-Taste öffnet das Startmenü.</desc>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Programme starten</text>
<path d="M70 200 h300 l50 140 l-50 140 h-300 l50 -140 z" fill="#E6F0FA" stroke="#0F6CBD" stroke-width="3"/><circle cx="190" cy="255" r="30" fill="#0F6CBD"/><text x="190" y="267" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="265" y="335" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">Startmenü öffnen</text><text x="265" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">Windows-Symbol in</text><text x="265" y="415" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">der Taskleiste klicken</text><path d="M460 200 h300 l50 140 l-50 140 h-300 l50 -140 z" fill="#E8EEF9" stroke="#185ABD" stroke-width="3"/><circle cx="580" cy="255" r="30" fill="#185ABD"/><text x="580" y="267" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="655" y="335" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">Programm suchen</text><text x="655" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">Namen ins Suchfeld tippen</text><text x="655" y="415" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">oder „Alle“ anklicken</text><path d="M850 200 h300 l50 140 l-50 140 h-300 l50 -140 z" fill="#E7F4EC" stroke="#107C41" stroke-width="3"/><circle cx="970" cy="255" r="30" fill="#107C41"/><text x="970" y="267" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="1045" y="335" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1E2430" text-anchor="middle">Programm anklicken</text><text x="1045" y="385" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">Einmal klicken genügt –</text><text x="1045" y="415" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#5B6472" text-anchor="middle">das Fenster öffnet sich</text><rect x="170" y="535" width="940" height="80" rx="10" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="640" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1E2430" text-anchor="middle">Tipp: Die Windows-Taste auf der Tastatur öffnet das Startmenü auch.</text>
<line x1="60" y1="660" x2="1220" y2="660" stroke="#D5DAE1" stroke-width="2"/>
<text x="60" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">Block 01 · Orientierung in Microsoft 365</text>
<text x="1220" y="694" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="end">Haus Lichtblick – Microsoft 365  ·  Folie 5</text>
</svg>
