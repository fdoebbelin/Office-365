<title id="t">Eine Tabelle einfügen und ausfüllen</title><desc id="d">Links das Raster aus dem Menü Einfügen, Tabelle: fünf mal fünf Kästchen sind markiert. Rechts die eingefügte Tabelle für das Wartungsprotokoll mit den Spalten Datum, Gewerk, Befund, Maßnahme, Erledigt, erste Zeile 15.04.2025, Elektro. Hinweise: Tab springt in die nächste Zelle, Umschalt+Tab zurück, Tab in der letzten Zelle fügt eine neue Zeile an. Tabellen in Word sind zum Ordnen, nicht zum Rechnen.</desc>
