<title id="t">Überschriften mit Formatvorlagen</title><desc id="d">Oben der Katalog der Formatvorlagen auf der Registerkarte Start mit Standard, Kein Leerraum, Überschrift 1, Überschrift 2 und Titel. Darunter links der Navigationsbereich mit der Gliederung des Wartungsprotokolls, rechts die Seite: Wartungsprotokoll Haus Lichtblick als Überschrift 1, Durchgeführte Arbeiten und Betroffene Gewerke als Überschrift 2. Hinweis: wie Kapitel im Buch; ein Klick im Navigationsbereich springt dorthin.</desc>
