<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Seitenränder und Druckvorschau</title><desc id="d">Links zwei Seiten: mit normalen Seitenrändern und mit schmalen Rändern von 1,27 cm rundum, die mehr Platz für Tabellen lassen – einzustellen unter Layout, Seitenränder. Rechts die Ansicht Datei, Drucken mit der Schaltfläche Drucken, den Einstellungen Drucker, Seiten, Hochformat, A4, Seitenränder und rechts der Vorschau. Merksatz: erst Vorschau, dann Papier.</desc>
