<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Tabellen bearbeiten</title><desc id="d">Drei Karten: Spaltenbreite ändern – Maus auf die Trennlinie, bis ein Doppelpfeil erscheint, dann ziehen. Zeile löschen – Schreibmarke in die Zeile, Layout, Löschen. Tabellenformat – Tabellenentwurf, Formatvorlage anklicken. Hinweis: Die Registerkarten Tabellenentwurf und Layout erscheinen nur, wenn die Schreibmarke in der Tabelle steht.</desc>
