<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Aufzählung und Nummerierung</title><desc id="d">Links eine Aufzählung mit Punkten – wie eine Einkaufsliste, die Reihenfolge ist egal: Elektro, Sanitär, Heizung, Brandschutz. Rechts eine nummerierte Liste – wie ein Kochrezept, die Reihenfolge zählt: die ersten vier Punkte der Checkliste Sicherheitsbegehung. Unten: Start, Gruppe Absatz, Aufzählungszeichen oder Nummerierung; Enter macht den nächsten Punkt, zweimal Enter beendet die Liste.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
