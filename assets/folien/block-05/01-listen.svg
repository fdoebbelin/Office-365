fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><rect x="680" y="170" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="690" y="184" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#107C41" text-anchor="middle">1</text><line x1="697" y1="180" x2="716" y2="180" stroke="#5B6472" stroke-width="2"/><text x="690" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#107C41" text-anchor="middle">2</text><line x1="697" y1="190" x2="716" y2="190" stroke="#5B6472" stroke-width="2"/><text x="690" y="204" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#107C41" text-anchor="middle">3</text><line x1="697" y1="200" x2="716" y2="200" stroke="#5B6472" stroke-width="2"/><text x="742" y="198" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#107C41" text-anchor="start">Nummerierung</text><text x="680" y="245" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start" font-style="italic">wie ein Kochrezept – Reihenfolge zählt</text><rect x="680" y="265" width="510" height="195" rx="8" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/><text x="710" y="305" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="end">1.</text><text x="725" y="305" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Fluchtwege frei und beleuchtet</text><text x="710" y="347" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="end">2.</text><text x="725" y="347" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Feuerlöscher vorhanden und geprüft</text><text x="710" y="389" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="end">3.</text><text x="725" y="389" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Notbeleuchtung funktionsfähig</text><text x="710" y="431" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="end">4.</text><text x="725" y="431" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1E2430" text-anchor="start">Rauchmelder getestet</text><rect x="60" y="505" width="1160" height="120" rx="12" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="90" y="545" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1E2430" text-anchor="start">So geht&#x27;s: Start → Gruppe „Absatz“ → Aufzählungszeichen oder Nummerierung</text><text x="90" y="580" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Enter macht den nächsten Punkt. Liste beenden: zweimal Enter.</text><text x="90" y="610" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Schon geschriebene Zeilen? Erst markieren, dann auf das Symbol klicken.</text>
