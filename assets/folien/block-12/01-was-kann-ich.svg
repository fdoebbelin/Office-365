<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Was Sie jetzt können</title><desc id="d">Drei Spalten mit Häkchen. Outlook: E-Mails schreiben und beantworten, weiterleiten mit Kommentar, An, Cc, Bcc und guter Betreff, Ordner, Termine mit Erinnerung, Serien und Besprechungen, Anhänge. Word: speichern und öffnen, markieren und formatieren, Absatz und neue Zeile, Listen und Überschriften, Tabellen, Seitenränder und Drucken, Excel-Daten einfügen. Excel: Daten eingeben, Formeln mit Zelladressen, Ausfüllkästchen, SUMME und MITTELWERT, Zahlenformate, sortieren und filtern, Diagramme.</desc>
