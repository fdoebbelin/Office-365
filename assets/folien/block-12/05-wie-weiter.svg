Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">XVERWEIS</text><circle cx="485" cy="342" r="5" fill="#107C41"/><text x="501" y="349" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Filter und bedingte Formatierung</text><circle cx="485" cy="386" r="5" fill="#107C41"/><text x="501" y="393" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Pivot-Tabellen</text><rect x="850" y="150" width="370" height="300" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M850 164 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v50 h-370 z" fill="#1F3A5F"/><text x="1035.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Aufbau Verknüpfung</text><circle cx="880" cy="254" r="5" fill="#1F3A5F"/><text x="896" y="261" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Kassenbuch mit Datenüberprüfung</text><circle cx="880" cy="298" r="5" fill="#1F3A5F"/><text x="896" y="305" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Excel in Word: einbetten</text><circle cx="880" cy="342" r="5" fill="#1F3A5F"/><text x="896" y="349" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">oder verknüpfen</text><circle cx="880" cy="386" r="5" fill="#1F3A5F"/><text x="896" y="393" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#1E2430" text-anchor="start">Serien-E-Mail</text><rect x="60" y="480" width="1160" height="140" rx="14" fill="#E7F4EC" stroke="#107C41" stroke-width="2"/><text x="90" y="525" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1E2430" text-anchor="start">Am besten lernen Sie im Alltag:</text><text x="90" y="562" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Nehmen Sie sich jede Woche eine echte Aufgabe vor – eine Störungsmeldung, eine Liste,</text><text x="90" y="592" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">einen Aushang – und lösen Sie sie mit den Werkzeugen aus dem Kurs.</text>
