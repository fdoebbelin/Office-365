<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Wie geht es weiter?</title><desc id="d">Drei Aufbaumodule: Word mit Absätzen, Bildern, Tabellen, Feldern, Kopf- und Fußzeilen, Formatvorlagen, Inhaltsverzeichnis und Geschäftsbrief nach DIN 5008; Excel mit WENN, SUMMEWENN, XVERWEIS, Filtern, bedingter Formatierung und Pivot-Tabellen; Verknüpfung mit Kassenbuch, Excel in Word einbetten oder verknüpfen und Serien-E-Mail. Darunter der Rat: jede Woche eine echte Aufgabe mit den Werkzeugen aus dem Kurs lösen.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
