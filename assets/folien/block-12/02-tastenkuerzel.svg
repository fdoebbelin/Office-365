<title id="t">Die wichtigsten Tastenkürzel</title><desc id="d">Tastenkürzel: Strg+S Speichern in Word und Excel, Strg+Z Rückgängig in allen drei Programmen, Strg+C Kopieren, Strg+V Einfügen, Strg+P Drucken, Strg+F Suchen, Alt+Tab Programm wechseln. Hervorgehoben: Strg+Z macht den letzten Schritt rückgängig, auch mehrmals – am Computer geht fast nichts kaputt.</desc>
