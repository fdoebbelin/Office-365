<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Ausblick: Copilot</title><desc id="d">Drei Karten zu Copilot. Was ist das: ein KI-Assistent in Outlook, Word und Excel, der E-Mails zusammenfasst, Texte entwirft und Formeln vorschlägt. Was braucht man: je nach Vertrag enthalten oder extra, der Arbeitgeber entscheidet. Worauf achten: Ergebnisse prüfen, nur mit dem Arbeitskonto, keine Mieterdaten eingeben, wenn es nicht erlaubt ist. Merksatz: Copilot schreibt den Entwurf – Sie bleiben verantwortlich für das Ergebnis.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
