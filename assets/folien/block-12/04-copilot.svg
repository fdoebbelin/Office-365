<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Ausblick: Copilot</text>
<rect x="60" y="150" width="370" height="300" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M60 164 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v50 h-370 z" fill="#1F3A5F"/><text x="245.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Was ist das?</text><text x="84" y="260" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Ein KI-Assistent in Outlook,</text><text x="84" y="296" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Word und Excel: fasst E-Mails</text><text x="84" y="332" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">zusammen, entwirft Texte,</text><text x="84" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">schlägt Formeln vor.</text><rect x="455" y="150" width="370" height="300" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M455 164 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v50 h-370 z" fill="#1F3A5F"/><text x="640.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Was braucht man?</text><text x="479" y="260" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Je nach Vertrag enthalten</text><text x="479" y="296" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">oder extra – ob und wo,</text><text x="479" y="332" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">entscheidet der Arbeitgeber.</text><text x="479" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start"></text><rect x="850" y="150" width="370" height="300" rx="14" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="2"/><path d="M850 164 a14 14 0 0 1 14 -14 h342 a14 14 0 0 1 14 14 v50 h-370 z" fill="#1F3A5F"/><text x="1035.0" y="194" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Worauf achten?</text><text x="874" y="260" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Ergebnisse immer prüfen.</text><text x="874" y="296" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Nur mit dem Arbeitskonto.</text><text x="874" y="332" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">Keine Mieterdaten eingeben,</text><text x="874" y="368" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#1E2430" text-anchor="start">wenn es nicht erlaubt ist.</text><rect x="60" y="480" width="1160" height="140" rx="14" fill="#FFF4D6" stroke="#E8A33D" stroke-width="2"/><text x="640" y="540" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1E2430" text-anchor="middle">„Copilot schreibt den Entwurf –</text><text x="640" y="585" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1E2430" text-anchor="middle">Sie bleiben verantwortlich für das Ergebnis.“</text>
