<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Häufige Fehler – und wie Sie sie vermeiden</title><desc id="d">Sechs Paare: Datei nicht gespeichert – früh und oft Strg+S; Zahl abgetippt statt Formel – mit Gleichheitszeichen beginnen und Zellen anklicken; formatiert ohne zu markieren – erst markieren, dann formatieren; E-Mail an den falschen Empfänger – An und Betreff vor dem Senden prüfen; alte Fassung angehängt – erst speichern, dann anhängen; mehrmals Enter für Abstand – Abstand über Layout einstellen.</desc>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E8A33D"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="110" rx="0" fill="#1F3A5F" stroke="none" stroke-width="2"/>
<text x="60" y="72" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="start">Häufige Fehler – und wie Sie sie vermeiden</text>
<text x="60" y="172" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#B3261E" text-anchor="start">Fehler</text><text x="700" y="172" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#107C41" text-anchor="start">So vermeiden Sie ihn</text><rect x="60" y="192" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="229" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Datei nicht gespeichert – Arbeit weg</text><path d="M648 221 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="192" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="229" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">früh und oft Strg+S</text><rect x="60" y="264" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="301" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Zahl abgetippt statt Formel</text><path d="M648 293 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="264" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="301" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">mit = beginnen, Zellen anklicken</text><rect x="60" y="336" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="373" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Formatiert, ohne zu markieren</text><path d="M648 365 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="336" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="373" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">erst markieren, dann formatieren</text><rect x="60" y="408" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="445" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">E-Mail an den falschen Empfänger</text><path d="M648 437 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="408" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="445" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">An und Betreff vor dem Senden prüfen</text><rect x="60" y="480" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="517" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Alte Fassung angehängt</text><path d="M648 509 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="480" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="517" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">erst speichern, dann anhängen</text><rect x="60" y="552" width="580" height="58" rx="8" fill="#FBE9E7" stroke="#D5DAE1" stroke-width="1.5"/><text x="80" y="589" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1E2430" text-anchor="start">Mehrmals Enter für Abstand</text><path d="M648 581 h38" stroke="#E8A33D" stroke-width="5" marker-end="url(#pf)"/><rect x="700" y="552" width="520" height="58" rx="8" fill="#E7F4EC" stroke="#D5DAE1" stroke-width="1.5"/><text x="720" y="589" font-family="Segoe UI, Aptos, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1E2430" text-anchor="start">Abstand über „Layout“ einstellen</text>
